name: vietfashion

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vietfashion}
      POSTGRES_USER: ${POSTGRES_USER:-vietfashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Separate from the PostgreSQL installation already using local port 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA beneath this directory.
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./database/postgresql/dataset_v2/01_schema.sql
        target: /docker-entrypoint-initdb.d/01_schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/postgresql/dataset_v2/02_import_dataset.sql
        target: /docker-entrypoint-initdb.d/02_seed.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/postgresql/dataset_v2/04_update_type_information.sql
        target: /docker-entrypoint-initdb.d/03_type_information.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
