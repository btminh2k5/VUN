name: vietfashion

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vietfashion}
      POSTGRES_USER: ${POSTGRES_USER:-vietfashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Separate from the PostgreSQL installation already using local port 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA beneath this directory.
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./database/postgresql/dataset_v2/01_schema.sql
        target: /docker-entrypoint-initdb.d/01_schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/postgresql/dataset_v2/02_import_dataset.sql
        target: /docker-entrypoint-initdb.d/02_seed.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/postgresql/dataset_v2/04_update_type_information.sql
        target: /docker-entrypoint-initdb.d/03_type_information.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/postgresql/dataset_v2/05_styling_items_schema.sql
        target: /docker-entrypoint-initdb.d/04_styling_items_schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/postgresql/dataset_v2/06_import_styling_items.sql
        target: /docker-entrypoint-initdb.d/05_import_styling_items.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vietfashion}
      POSTGRES_USER: ${POSTGRES_USER:-vietfashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-MY_GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "127.0.0.1:${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data:
